# Namespace is set at apply time; the chart provisions a native k8s Secret by design
# (external-secrets / vault-csi is opt-in). Disable the KICS namespace + external-storage queries.
# kics-scan disable=611ab018-c4aa-4ba2-b0f6-a448337509a6,b9c83569-459b-4110-8f79-6305aa33cb37
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dunmir.fullname" . }}-env
  labels:
    {{- include "dunmir.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.data }}
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end -}}
{{- if .Values.git.sshKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dunmir.fullname" . }}-git-ssh
  labels:
    {{- include "dunmir.labels" . | nindent 4 }}
type: Opaque
stringData:
  # `|` (clip), NOT `|-` (strip): an OpenSSH private key must end with a
  # trailing newline — `|-` eats it and ssh then fails with `error in libcrypto`.
  git_deploy: |
    {{- .Values.git.sshKey | nindent 4 }}
  {{- if .Values.git.knownHosts }}
  known_hosts: |
    {{- .Values.git.knownHosts | nindent 4 }}
  {{- end }}
{{- end -}}
