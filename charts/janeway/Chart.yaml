apiVersion: v2
name: janeway
description: Janeway — an open-source platform for publishing journals, preprints, conference proceedings and books
type: application

# version is the CHART version and appVersion is the application version. They
# are bumped independently on purpose: a chart-only fix (a probe tweak, a new
# value) must not imply the application changed, and an image bump must not
# require a chart change to be deployable.
#
# appVersion doubles as the default image tag (see _helpers.tpl janeway.image),
# so it has to name a tag that tengen-systems/janeway has ACTUALLY published —
# hence the leading "v", which is unconventional for appVersion and deliberate.
# That repo releases through Diatreme, which tags images `v<version>`, so
# "0.1.0" resolved to ghcr.io/tengen-systems/janeway:0.1.0 — a tag that does not
# exist, and whose symptom is every pod in ImagePullBackOff looking like a
# credentials problem. The alternative is every consumer pinning image.tag by
# hand, which is what the platform2 HelmRelease had to do.
version: 0.1.8
appVersion: "v0.0.5"

home: https://janeway.systems
sources:
  - https://github.com/MagmaMoose/charts
  - https://github.com/tengen-systems/janeway
  - https://github.com/openlibhums/janeway

keywords:
  - janeway
  - publishing
  - journal
  - preprints
  - open-access
  - django

maintainers:
  - name: Caleb Sargeant
    url: https://github.com/CalebSargeant

# Upstream Janeway is AGPL-3.0; this chart is MIT (see LICENSE at the repo root).
# Recorded because Artifact Hub surfaces it and the distinction matters for a
# chart that deploys AGPL software.
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: office-business
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Janeway upstream
      url: https://github.com/openlibhums/janeway
    - name: Production image
      url: https://github.com/tengen-systems/janeway
  artifacthub.io/changes: |
    - kind: fixed
      description: |
        Per-journal theme customisation now works. src/static and
        src/collected-static are mounted from the files volume and seeded from
        the image by an init container, so `manage.py build_assets` can write
        the per-journal override stylesheets that every theme template asks for.
        Previously it died on a read-only filesystem, and the bootstrap Job's
        copy was written into a pod that was then thrown away.
