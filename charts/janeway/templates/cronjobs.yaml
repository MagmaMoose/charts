{{- if .Values.cronJobs.enabled }}
{{- $root := . -}}
{{- $defaults := .Values.cronJobs.defaults -}}
{{- range $name, $job := .Values.cronJobs.jobs }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "janeway.fullname" $root }}-{{ $name }}
  labels:
    {{- include "janeway.labels" $root | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  schedule: {{ $job.schedule | quote }}
  # Janeway's own scheduler installs a crontab inside the container
  # (install_cron), which is a no-op here — there is no crond in the image, and
  # a per-pod crontab would fire once per replica anyway. These CronJobs are the
  # replacement, and the app's CronMiddleware is removed in the production
  # settings so nothing runs scheduled work inside an HTTP request.
  concurrencyPolicy: {{ default $defaults.concurrencyPolicy $job.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ default $defaults.successfulJobsHistoryLimit $job.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default $defaults.failedJobsHistoryLimit $job.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ default $defaults.startingDeadlineSeconds $job.startingDeadlineSeconds }}
  {{- if $job.suspend }}
  suspend: true
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        {{- include "janeway.labels" $root | nindent 8 }}
        app.kubernetes.io/component: cron
    spec:
      backoffLimit: {{ default $defaults.backoffLimit $job.backoffLimit }}
      activeDeadlineSeconds: {{ default $defaults.activeDeadlineSeconds $job.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "janeway.labels" $root | nindent 12 }}
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: {{ default $defaults.restartPolicy $job.restartPolicy }}
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "janeway.serviceAccountName" $root }}
          automountServiceAccountToken: false
          {{- with $root.Values.cronJobs.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ include "janeway.image" $root }}
              imagePullPolicy: {{ $root.Values.image.pullPolicy }}
              args:
                - manage
                {{- range $job.command }}
                - {{ . | quote }}
                {{- end }}
              securityContext:
                {{- toYaml $root.Values.securityContext | nindent 16 }}
              env:
                {{- include "janeway.env" $root | nindent 16 }}
              envFrom:
                {{- include "janeway.envFrom" $root | nindent 16 }}
              resources:
                {{- toYaml (default $defaults.resources $job.resources) | nindent 16 }}
              volumeMounts:
                {{- include "janeway.volumeMounts" $root | nindent 16 }}
          volumes:
            {{- include "janeway.volumes" $root | nindent 12 }}
          {{- with $root.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
