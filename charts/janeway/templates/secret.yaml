{{/*
Chart-managed Secrets, created ONLY when no existingSecret was supplied.

These are a convenience for local testing. In any real deployment set
`*.existingSecret` and let an ExternalSecret, a sealed secret, or the platform's
own secret manager own the value — anything written here is stored verbatim in
the Helm release history, which is a ConfigMap-shaped object in the cluster that
survives uninstall and is readable by anyone with release-read access.

Same hook weight as the ConfigMap, for the same reason: the migration and
bootstrap hooks reference these by secretKeyRef.
*/}}
{{- $fullName := include "janeway.fullname" . -}}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-5" -}}

{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-db
  labels:
    {{- include "janeway.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.password | quote }}
{{- end }}

{{- if not .Values.secretKey.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secret-key
  labels:
    {{- include "janeway.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secretKey.existingSecretKey }}: {{ .Values.secretKey.value | quote }}
{{- end }}

{{- if and .Values.bootstrap.enabled .Values.bootstrap.superuser.email (not .Values.bootstrap.superuser.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-superuser
  labels:
    {{- include "janeway.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.bootstrap.superuser.existingSecretKey }}: {{ .Values.bootstrap.superuser.password | quote }}
{{- end }}
