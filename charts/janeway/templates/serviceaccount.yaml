{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "janeway.serviceAccountName" . }}
  labels:
    {{- include "janeway.labels" . | nindent 4 }}
  annotations:
    # Created in the pre-install hook phase because the migration and bootstrap
    # Jobs are hooks and name this account. Helm would otherwise create it in
    # the main phase — after the pre-install hook has already tried to run — and
    # the Job would fail with "error looking up service account".
    # pre-install ONLY, for the same reason as the PVC: Helm's default
    # hook-delete-policy (before-hook-creation) applies even when unwritten, so
    # pre-upgrade would delete and recreate this account on every upgrade. A
    # ServiceAccount has no finalizer so it would not hang the way the PVC did,
    # but it is still a window in which pods naming it can fail admission, for no
    # benefit — the account already exists by upgrade time.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Janeway talks to Postgres and the filesystem, never to the Kubernetes API, so
# no token is projected and no Role is bound to this account.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
