apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka-tester.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-tester.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka-tester.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kafka-tester.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka-tester.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      # Off because of a name clash. For a Service called kafka-tester, Kubernetes
      # injects KAFKA_TESTER_PORT, KAFKA_TESTER_SERVICE_HOST and the rest into every
      # pod in the namespace, and KAFKA_TESTER_ is the prefix the app reads its
      # settings from. Nothing here finds peers through those variables.
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kafka-tester
          image: {{ include "kafka-tester.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "kafka-tester.env" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; Python and gunicorn still expect a
            # writable temp directory.
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.caBundle.secretName .Values.caBundle.configMapName }}
            - name: ca-bundle
              mountPath: {{ include "kafka-tester.caMountPath" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.caBundle.secretName }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caBundle.secretName }}
            items:
              - key: {{ .Values.caBundle.key }}
                path: ca.crt
        {{- else if .Values.caBundle.configMapName }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.caBundle.configMapName }}
            items:
              - key: {{ .Values.caBundle.key }}
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
