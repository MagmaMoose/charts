# kics-scan disable=DS137138
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kafka-tester.fullname" . }}-test-connection
  labels:
    {{- include "kafka-tester.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.37
      # /healthz proves the process serves; / proves the templates and static
      # files made it into the image.
      command:
        - sh
        - -c
        - |
          set -e
          _svc="http://{{ include "kafka-tester.fullname" . }}:{{ .Values.service.port }}" # DevSkim: ignore DS137138
          wget -q -O- "$_svc/healthz"
          wget -q -O- "$_svc/" | grep -q "Kafka Tester"
          echo OK
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
